[project]
name = "get-md"
version = "0.1.0"
description = "Fetch a JavaScript-rendered web page and convert it to Markdown."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "markdownify>=1.1",
    "playwright>=1.40",
    "pyyaml>=6.0",
]

[project.scripts]
get-md = "get_md.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/get_md"]
